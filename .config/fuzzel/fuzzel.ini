[main]
include=~/.config/fuzzel/kanagawa-wave.ini

font=JetBrains Mono NL:size=12, monospace:size=12
use-bold=no
prompt="❯ "
terminal=uwsm app -- foot
launch-prefix=uwsm app -- 

anchor=top
x-margin=0
y-margin=64
lines=12
width=30
horizontal-pad=32
vertical-pad=16
inner-pad=16

[border]
width=3
radius=3
selection-radius=3
